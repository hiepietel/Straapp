# Production: the base plus your domain. infra/deploy.sh builds the images, loads them into k3s,
# sets newTag below to the commit it built, and applies this folder on the server.
#
# Before the first deploy, replace straapp.example.com below with your domain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: straapp-api
    newTag: latest
  - name: straapp-ui
    newTag: latest

patches:
  - target:
      kind: Ingress
      name: straapp
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: straapp.example.com
      - op: replace
        path: /spec/rules/0/host
        value: straapp.example.com
