# PostgreSQL with its data on a persistent volume (k3s' local-path storage: a folder on the server).
# Credentials come from the straapp-postgres secret.
apiVersion: v1
kind: Service
metadata:
  name: straapp-postgres
  labels:
    app.kubernetes.io/name: straapp-postgres
spec:
  selector:
    app.kubernetes.io/name: straapp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: straapp-postgres
  labels:
    app.kubernetes.io/name: straapp-postgres
spec:
  serviceName: straapp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: straapp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straapp-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # "postgres" in the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: straapp
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: straapp-postgres, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: straapp-postgres, key: password }
          volumeMounts:
            # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d straapp"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d straapp"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
