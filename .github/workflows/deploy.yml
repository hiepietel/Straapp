# Every push to main: run the checks, build both images and push them to GitHub's registry (ghcr.io),
# then SSH into the server and apply the Kubernetes manifests pinned to those images.
#
# Needs, under Settings → Secrets and variables → Actions (see infra/README.md):
#   secrets  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
#   variable DEPLOY_PORT (optional, default 22)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button, e.g. to redeploy

# One deploy at a time; a newer push waits rather than cancelling one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    name: Push image (${{ matrix.app }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        # Registry paths must be lowercase; GitHub owners may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/straapp-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to the server
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Pin the images to this commit
        working-directory: infra/k8s/overlays/production
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          command -v kustomize >/dev/null || curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /usr/local/bin
          kustomize edit set image \
            "straapp-api=ghcr.io/$owner/straapp-api:$GITHUB_SHA" \
            "straapp-ui=ghcr.io/$owner/straapp-ui:$GITHUB_SHA"
          kubectl kustomize . > "$RUNNER_TEMP/straapp.yaml"
          grep 'image:' "$RUNNER_TEMP/straapp.yaml"

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Apply and wait for the rollout
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" '
            set -e
            kubectl apply -f -
            kubectl -n straapp rollout status statefulset/straapp-postgres --timeout=5m
            kubectl -n straapp rollout status deployment/straapp-api --timeout=10m
            kubectl -n straapp rollout status deployment/straapp-ui --timeout=5m
            kubectl -n straapp get pods
          ' < "$RUNNER_TEMP/straapp.yaml"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
