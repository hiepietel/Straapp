# Checks every change: the API builds and its unit tests pass, the web app builds and typechecks, and both
# Docker images build (the API's image runs the unit tests too).
# Nothing is deployed from GitHub: you deploy from your own machine with infra/deploy.sh.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build api/Straapp.slnx -c Release
      - run: dotnet test api/Straapp.slnx -c Release --no-build

  ui:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  images:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
